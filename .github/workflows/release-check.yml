name: Release check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      # npm ci currently trips over optional WASM peer entries in the lockfile on Linux
      # for this Vite/Tailwind toolchain; npm install is deterministic enough for CI here
      # because package-lock.json is committed and the release verifier checks outputs.
      - run: npm install
      - run: npm run release:check
